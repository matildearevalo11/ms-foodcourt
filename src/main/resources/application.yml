spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: ms-foodcourt
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/foodcourt}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /api/v1
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html
  api-docs:
    enabled: false

clients:
  users:
    base-url: ${USERS_SERVICE_URL:http://localhost:8081/api/v1}
    api-key: ${USERS_INTERNAL_API_KEY:1234567890abcde}
    connect-timeout: ${USERS_CONNECT_TIMEOUT:2s}
    read-timeout: ${USERS_READ_TIMEOUT:3s}
  traceability:
    base-url: ${TRACEABILITY_SERVICE_URL:http://localhost:8083/api/v1}
    api-key: ${TRACEABILITY_API_KEY:1234567890abcde}
    connect-timeout: ${TRACEABILITY_CONNECT_TIMEOUT:2s}
    read-timeout: ${TRACEABILITY_READ_TIMEOUT:3s}
  messaging:
    base-url: ${MESSAGING_SERVICE_URL:http://localhost:8084/api/v1}
    api-key: ${MESSAGING_INTERNAL_API_KEY:foodcourt-messaging-local-key}
    connect-timeout: ${MESSAGING_CONNECT_TIMEOUT:2s}
    read-timeout: ${MESSAGING_READ_TIMEOUT:3s}
jwt:
  secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef}

security:
  order-pin-secret: ${ORDER_PIN_SECRET:foodcourt-order-pin-secret-local-2026}
