spring:
  application:
    name: ms-foodcourt
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/foodcourt}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /api/v1
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html
  api-docs:
    enabled: false

clients:
  users:
    base-url: ${USERS_SERVICE_URL:http://localhost:8081/api/v1}
    connect-timeout: ${USERS_CONNECT_TIMEOUT:2s}
    read-timeout: ${USERS_READ_TIMEOUT:3s}
