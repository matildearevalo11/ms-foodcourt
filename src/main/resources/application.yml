server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/foodcourt}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:db/sql/data.sql

clients:
  users:
    base-url: ${USERS_SERVICE_URL:http://localhost:8081/api/v1}

jwt:
  secret: ${JWT_SECRET:2b31c76f74d6be0c35ec182a3c5bcd1c86de81b29df586ab82f28cd92ca11da4}

springdoc:
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html
  api-docs:
    enabled: false

appDescription: "Microservice for Food Court Restaurant Management"
appVersion: "1.0.0"
