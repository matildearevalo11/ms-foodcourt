openapi: 3.0.3
info:
  title: Food Court API
  description: Restaurant management microservice
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /restaurants:
    post:
      tags: [restaurants]
      summary: Create a restaurant
      operationId: createRestaurant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantRequest'
      responses:
        '201':
          description: Restaurant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantResponseEnvelope'
        '400': { description: Invalid fields, duplicated NIT or owner without OWNER role }
        '503': { description: User service unavailable }
  /restaurants/{restaurantId}/dishes:
    post:
      tags: [dishes]
      summary: Create a dish for a restaurant
      operationId: createDish
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DishRequest' }
      responses:
        '201':
          description: Dish created and enabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DishResponseEnvelope' }
        '400': { description: Invalid fields, restaurant or category }
  /restaurants/{restaurantId}/dishes/{dishId}:
    patch:
      tags: [dishes]
      summary: Update a dish's price and description
      operationId: updateDish
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - in: path
          name: dishId
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DishUpdateRequest' }
      responses:
        '200':
          description: Dish updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DishResponseEnvelope' }
        '400': { description: Invalid price or description }
        '404': { description: Dish does not exist in the restaurant }
  /restaurants/{restaurantId}/dishes/{dishId}/status:
    patch:
      tags: [dishes]
      summary: Enable or disable a dish
      operationId: updateDishStatus
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - in: path
          name: dishId
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DishStatusRequest' }
      responses:
        '200':
          description: Dish status updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DishResponseEnvelope' }
        '400': { description: Status is required }
        '401': { description: Authentication required }
        '403': { description: Only the restaurant owner can update the dish }
        '404': { description: Dish does not exist in the restaurant }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RestaurantRequest:
      type: object
      required: [name, nit, address, phone, urlLogo, ownerId]
      properties:
        name:
          type: string
          pattern: '.*[^0-9].*'
          example: El Corral 2
        nit:
          type: string
          pattern: '^\d+$'
          example: '900123456'
        address: { type: string, example: 'Local 15' }
        phone:
          type: string
          maxLength: 13
          pattern: '^\+?\d+$'
          example: '+573005698325'
        urlLogo: { type: string, example: 'https://cdn.example.com/logo.png' }
        ownerId: { type: integer, format: int64, minimum: 1 }
    RestaurantResponse:
      allOf:
        - $ref: '#/components/schemas/RestaurantRequest'
        - type: object
          properties:
            id: { type: integer, format: int64 }
    RestaurantResponseEnvelope:
      type: object
      properties:
        data: { $ref: '#/components/schemas/RestaurantResponse' }
    DishRequest:
      type: object
      required: [name, price, description, urlImage, categoryId]
      properties:
        name: { type: string, example: Hamburguesa especial }
        price: { type: integer, format: int64, minimum: 1, example: 25000 }
        description: { type: string, example: Carne, queso y vegetales }
        urlImage: { type: string, example: 'https://cdn.example.com/dish.png' }
        categoryId: { type: integer, format: int64, minimum: 1, example: 2 }
    DishResponse:
      allOf:
        - $ref: '#/components/schemas/DishRequest'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            restaurantId: { type: integer, format: int64 }
            active: { type: boolean, example: true }
    DishUpdateRequest:
      type: object
      required: [price, description]
      properties:
        price: { type: integer, format: int64, minimum: 1, example: 30000 }
        description: { type: string, example: Nueva descripción del plato }
    DishStatusRequest:
      type: object
      required: [active]
      properties:
        active: { type: boolean, example: false }
    DishResponseEnvelope:
      type: object
      properties:
        data: { $ref: '#/components/schemas/DishResponse' }
